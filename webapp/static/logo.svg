<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background Shield / Rounded Badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="13.25" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Stylized Face Outline -->
  <path d="M21 21 C21 13 43 13 43 21 C43 28 41 39 37 46 C35 49.5 29 49.5 27 46 C23 39 21 28 21 21 Z" 
        stroke="#e0f2fe" stroke-width="1.75" stroke-dasharray="2 1.5" opacity="0.65"/>

  <!-- Scanning Constellation Grid / Connecting Lines -->
  <path d="M32 20 L23 35 M32 20 L41 35 M32 20 L32 30 M23 35 L32 30 M41 35 L32 30 M23 35 L32 44 M41 35 L32 44 M32 30 L32 44" 
        stroke="#5eead4" stroke-width="1" stroke-opacity="0.45"/>

  <!-- 5 Anatomical Scan Nodes -->
  <!-- 1. Forehead -->
  <circle cx="32" cy="20" r="4.5" stroke="#38bdf8" stroke-width="1" fill="#0369a1" fill-opacity="0.5"/>
  <circle cx="32" cy="20" r="2" fill="#e0f2fe"/>

  <!-- 2. Nose -->
  <circle cx="32" cy="30" r="4" stroke="#2dd4bf" stroke-width="1" fill="#0f766e" fill-opacity="0.5"/>
  <circle cx="32" cy="30" r="1.8" fill="#5eead4"/>

  <!-- 3. Left Cheek -->
  <circle cx="23" cy="35" r="4" stroke="#2dd4bf" stroke-width="1" fill="#0f766e" fill-opacity="0.5"/>
  <circle cx="23" cy="35" r="1.8" fill="#5eead4"/>

  <!-- 4. Right Cheek -->
  <circle cx="41" cy="35" r="4" stroke="#2dd4bf" stroke-width="1" fill="#0f766e" fill-opacity="0.5"/>
  <circle cx="41" cy="35" r="1.8" fill="#5eead4"/>

  <!-- 5. Chin -->
  <circle cx="32" cy="44" r="4" stroke="#2dd4bf" stroke-width="1" fill="#0f766e" fill-opacity="0.5"/>
  <circle cx="32" cy="44" r="1.8" fill="#5eead4"/>

  <!-- Clinical Medical Cross Accent in Top-Right -->
  <g transform="translate(42, 6)">
    <circle cx="9" cy="9" r="8" fill="#0d9488" stroke="#ffffff" stroke-width="1.25"/>
    <path d="M9 5.5 V12.5 M5.5 9 H12.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
